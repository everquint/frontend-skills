# Release-note grouping for GitHub's "Generate release notes" — the app path for a changelog
# (workflow SKILL.md, Release "Scoped by consumer"). An app has no consumers upgrading it, so its
# notes are generated from the PRs merged since the previous tag rather than maintained in a file.
# A LIBRARY ignores this file: its CHANGELOG.md is generated from changesets by the release job.
#
# Grouping keys off labels, so it only reads well if PRs carry them; the catch-all keeps unlabelled
# PRs visible instead of silently dropping them. ORDER MATTERS — GitHub files each PR under the
# FIRST matching category, so `'*'` goes LAST or it swallows every labelled PR (caught in review:
# with the catch-all above Dependencies, every bot PR landed in "Other changes" and the
# Dependencies section could never receive one).
changelog:
    exclude:
        labels: [skip-changelog]
    categories:
        - title: Features
          labels: [feature, enhancement]
        - title: Fixes
          labels: [bug, fix]
        - title: Performance
          labels: [performance]
        - title: Dependencies
          labels: [dependencies]
        - title: Other changes
          labels: ['*']
