# Release-note grouping for GitHub's "Generate release notes" — the FALLBACK path for a changelog
# (workflow SKILL.md, Release "Scoped by readership"), for a repo whose notes nobody reads: an
# internal tool, a spike, a continuously-deployed service. It lists PR titles, which describe code,
# so it cannot explain behaviour to a user. Any repo with readers — library OR app — deletes this
# file and generates CHANGELOG.md from changeset fragments via the release job instead.
#
# Grouping keys off labels, so it only reads well if PRs carry them; the catch-all keeps unlabelled
# PRs visible instead of silently dropping them. ORDER MATTERS — GitHub files each PR under the
# FIRST matching category, so `'*'` goes LAST or it swallows every labelled PR (caught in review:
# with the catch-all above Dependencies, every bot PR landed in "Other changes" and the
# Dependencies section could never receive one).
changelog:
    exclude:
        labels: [skip-changelog]
    categories:
        - title: Features
          labels: [feature, enhancement]
        - title: Fixes
          labels: [bug, fix]
        - title: Performance
          labels: [performance]
        - title: Dependencies
          labels: [dependencies]
        - title: Other changes
          labels: ['*']
