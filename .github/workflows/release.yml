name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset tag reads existing tags to decide what is untagged, and
          # @changesets/changelog-github resolves each changeset back to its commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Validate skills
        run: npm run validate

      # ── TEMPORARILY COMMENTED (2026-08-04, by request) ──────────────────────────────────────────
      # The org disables "Allow GitHub Actions to create and approve pull requests" and RELEASE_TOKEN
      # (a fine-grained PAT: contents write + pull-requests write, this repo only) is not yet set —
      # so with changesets pending this step versions, pushes changeset-release/main, and then fails
      # red on the PR create: `HttpError: GitHub Actions is not permitted to create or approve pull
      # requests` (measured on run 30903247932). Commented until the secret exists, to stop the red
      # run per feature merge.
      #
      # WHAT THIS COSTS while commented — the SAME step also tags on a version-PR merge, so releases
      # are fully manual:
      #   npx changeset version && git checkout -b changeset-release/main && commit + PR + merge
      #   npx changeset tag && git push --tags       # after the version PR merges
      # UNCOMMENT the whole block the moment RELEASE_TOKEN is added; nothing else needs changing.
      # See docs/adr/0006 for why a PAT and not a hand-rolled version phase.
      #
      # Two-phase, and it releases nothing on an ordinary push. With changesets
      # pending it opens or updates the "Version Packages" PR; with none pending it
      # runs the release script, which tags only a version that is not tagged yet.
      # - uses: changesets/action@v1.9.0
      #   with:
      #     version: npm run version
      #     publish: npm run release
      #     # The action's default commit message and PR title are both `Version Packages`, which is
      #     # NOT conventional — and `npm ci` above ran `prepare: husky`, so the commit-msg hook is
      #     # live in the runner and rejects it: `type may not be empty`, exit 1, release failed.
      #     # Measured on the first release with changesets pending. Both are overridden rather than
      #     # disabling the hook, so the commit that lands on the default branch passes the same
      #     # commitlint rule as every other commit.
      #     commit: 'chore: version packages'
      #     title: 'chore: version packages'
      #   env:
      #     # RELEASE_TOKEN exists because this org disables Actions-created PRs — the default
      #     # GITHUB_TOKEN versions, commits, pushes the branch, then dies on the last call. A
      #     # PAT-created PR also triggers validate/commitlint, which a GITHUB_TOKEN PR would not.
      #     # The fallback keeps the tag-only path working when the secret is absent or expired.
      #     GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
