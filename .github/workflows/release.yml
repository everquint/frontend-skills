name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset tag reads existing tags to decide what is untagged, and
          # @changesets/changelog-github resolves each changeset back to its commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Validate skills
        run: npm run validate

      # Two-phase, and it releases nothing on an ordinary push. With changesets
      # pending it opens or updates the "Version Packages" PR; with none pending it
      # runs the release script, which tags only a version that is not tagged yet.
      - uses: changesets/action@v1.9.0
        with:
          version: npm run version
          publish: npm run release
          # The action's default commit message and PR title are both `Version Packages`, which is
          # NOT conventional — and `npm ci` above ran `prepare: husky`, so the commit-msg hook is
          # live in the runner and rejects it: `type may not be empty`, exit 1, release failed.
          # Measured on the first release with changesets pending. Both are overridden rather than
          # disabling the hook, so the commit that lands on the default branch passes the same
          # commitlint rule as every other commit.
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # RELEASE_TOKEN is a fine-grained PAT scoped to this repo (contents: write,
          # pull-requests: write). It exists because this org disables "Allow GitHub Actions to create
          # and approve pull requests", so with the default GITHUB_TOKEN the action versions, commits,
          # pushes the branch, and then dies on the last call:
          #   HttpError: GitHub Actions is not permitted to create or approve pull requests.
          # Measured on run 30903247932. See references/release-tooling.md in eq-frontend-workflow.
          #
          # It also fixes a second thing: a PR opened with the default GITHUB_TOKEN triggers no
          # downstream workflows, so the version PR would arrive with no CI at all on a diff that
          # rewrites package.json and CHANGELOG.md. A PAT-created PR runs validate and commitlint.
          #
          # The fallback keeps the tag-only path working when the secret is absent or expired — that
          # path never creates a PR, so it does not need the PAT. The version path still fails loudly
          # at PR creation, which is the intended failure: visible red, never a silent skip.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
